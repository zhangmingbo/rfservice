server:
  port: 9990
spring:
  thymeleaf:
    cache: true
    check-template: true
    check-template-location: true
    content-type: text/html
    enabled: true
    encoding: UTF-8
    excluded-view-names: ''
    mode: HTML5
    prefix: classpath:/templates/
    suffix: .html
  redis:
    host: localhost
    port: 6379
    password: ''
    database: 0

# 录音处理线程池配置
recorder:
  thread-pool:
    size: 8  # 根据并发量调整，默认8个线程
  file-monitor:
    interval-seconds: 10  # 文件监控轮询间隔，默认10秒

